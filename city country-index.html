<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Live Traffic Radar - City/Country Format</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #f8fafc; }
    #map { width: 100vw; height: 100vh; background: #aad3df; z-index: 1; }

    /* Pill Box */
    #draggableBox {
      position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
      z-index: 2000; background: white;
      display: inline-flex; align-items: center; gap: 12px;
      padding: 8px 18px; border-radius: 50px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.12); border: 1px solid #e2e8f0;
      cursor: move; user-select: none; white-space: nowrap; 
    }

    .status-dot { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; animation: pulse-dot 1.5s infinite; flex-shrink: 0; }
    @keyframes pulse-dot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(1.5); } }

    .count-text { font-family: sans-serif; font-weight: 700; color: #1e293b; font-size: 16px; margin-right: 5px; }

    #resetBtn {
      background: #f1f5f9; border: none; border-radius: 50%;
      width: 28px; height: 28px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
    }
    #resetBtn:hover { background: #e2e8f0; }
    #resetBtn svg { width: 16px; height: 16px; fill: #64748b; }

    /* Markers */
    .blinking-marker { width: 18px !important; height: 18px !important; border-radius: 50%; border: 2px solid white; animation: marker-pulse 1.8s infinite; cursor: pointer; }
    .red { background: #ef4444; box-shadow: 0 0 10px #ef4444; }
    .green { background: #22c55e; box-shadow: 0 0 10px #22c55e; }
    @keyframes marker-pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.3); opacity: 0.7; } }

    /* Modern Tooltip Styling */
    .leaflet-tooltip {
      background: rgba(30, 41, 59, 0.9); 
      color: white; 
      border: none; 
      border-radius: 6px;
      font-weight: 600; 
      padding: 6px 12px; 
      font-family: sans-serif;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      font-size: 13px;
    }
    .leaflet-tooltip-top:before { border-top-color: rgba(30, 41, 59, 0.9); }
  </style>
</head>
<body>

  <div id="draggableBox">
    <div class="status-dot"></div>
    <div class="count-text" id="liveCounter">Live-0</div>
    <button id="resetBtn" title="Reposition to Default">
      <svg viewBox="0 0 24 24"><path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3c-.46-4.17-3.77-7.48-7.94-7.94V1h-2v2.06C6.83 3.52 3.52 6.83 3.06 11H1v2h2.06c.46 4.17 3.77 7.48 7.94 7.94V23h2v-2.06c4.17-.46 7.48-3.77 7.94-7.94H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg>
    </button>
  </div>

  <div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, push, set, onValue, onDisconnect, remove, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA5LrVUt1ySlFTt3hQ24qALlqXYffv1pag",
    authDomain: "live-web-traffic-letterc-8f8bf.firebaseapp.com",
    databaseURL: "https://live-web-traffic-letterc-8f8bf-default-rtdb.firebaseio.com",
    projectId: "live-web-traffic-letterc-8f8bf",
    storageBucket: "live-web-traffic-letterc-8f8bf.firebasestorage.app",
    messagingSenderId: "54493984326",
    appId: "1:54493984326:web:9e569aa3da36f1e3c0bc47"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const activeMarkers = {}; 

  const defaultCenter = [30, 10];
  const defaultZoom = 2.5;

  const map = L.map('map', { 
    zoomControl: false,
    attributionControl: false,
    minZoom: 2,
    worldCopyJump: true 
  }).setView(defaultCenter, defaultZoom);

  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png').addTo(map);

  document.getElementById('resetBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    map.flyTo(defaultCenter, defaultZoom, { animate: true, duration: 1.5 });
  });

  // Updated Geolocation Waterfall with Country extraction
  async function getDetailedCoords() {
    const apis = [
      () => fetch('https://ipapi.co/json/').then(r => r.json()).then(d => ({ lat: d.latitude, lng: d.longitude, location: `${d.city}, ${d.country_name}` })),
      () => fetch('https://ipwho.is/').then(r => r.json()).then(d => ({ lat: d.latitude, lng: d.longitude, location: `${d.city}, ${d.country}` })),
      () => fetch('https://freeipapi.com/api/json').then(r => r.json()).then(d => ({ lat: d.latitude, lng: d.longitude, location: `${d.cityName}, ${d.countryName}` }))
    ];

    for (let api of apis) {
      try {
        const res = await api();
        if (res.lat && res.lat !== 0) return res;
      } catch (e) { continue; }
    }
    return { lat: 23.81, lng: 90.41, location: "Dhaka, Bangladesh" }; 
  }

  onValue(ref(db, 'online_presence'), (snapshot) => {
    const data = snapshot.val() || {};
    document.getElementById('liveCounter').innerText = `Live-${Object.keys(data).length}`;
    
    Object.keys(activeMarkers).forEach(id => {
      if (!data[id]) { map.removeLayer(activeMarkers[id]); delete activeMarkers[id]; }
    });

    Object.keys(data).forEach(id => {
      if (!activeMarkers[id]) {
        const val = data[id];
        const icon = L.divIcon({
          className: '',
          html: `<div class="blinking-marker ${val.color}"></div>`,
          iconSize: [18, 18], iconAnchor: [9, 9]
        });
        
        activeMarkers[id] = L.marker([val.lat, val.lng], { icon })
          .addTo(map)
          .bindTooltip(val.location, { 
            direction: 'top', 
            offset: [0, -10],
            sticky: true // Label follows mouse slightly
          });
      }
    });
  });

  async function join() {
    const presenceRef = ref(db, 'online_presence');
    const snap = await get(presenceRef);
    if (snap.size > 20) await remove(presenceRef);

    const locData = await getDetailedCoords();
    const myRef = push(presenceRef);
    set(myRef, { 
      lat: locData.lat, 
      lng: locData.lng, 
      location: locData.location, 
      color: Math.random() > 0.5 ? 'red' : 'green' 
    });
    onDisconnect(myRef).remove();
  }
  join();

  // Draggable Box Logic
  const box = document.getElementById("draggableBox");
  let drag = false, ox, oy;
  box.onmousedown = (e) => { if (e.target.closest('#resetBtn')) return; drag = true; ox = e.clientX - box.offsetLeft; oy = e.clientY - box.offsetTop; };
  document.onmousemove = (e) => { if (drag) { box.style.left = (e.clientX - ox) + "px"; box.style.top = (e.clientY - oy) + "px"; box.style.transform = "none"; } };
  document.onmouseup = () => drag = false;
</script>
</body>
</html>
